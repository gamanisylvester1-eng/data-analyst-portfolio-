<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analyst Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #ec4899; --bg: #0f172a; --bg-card: #1e293b; --text: #f1f5f9; --text-muted: #94a3b8; --border: #334155; }
        .light-mode { --bg: #f8fafc; --bg-card: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; transition: all 0.3s ease; }
        nav { position: fixed; top: 0; width: 100%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .light-mode nav { background: rgba(248, 250, 252, 0.9); }
        .logo { font-size: 1.5rem; font-weight: bold; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: var(--text); text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: var(--primary); }
        .theme-toggle { background: none; border: 2px solid var(--primary); color: var(--primary); padding: 0.5rem 1rem; border-radius: 25px; cursor: pointer; font-size: 1rem; transition: all 0.3s; }
        .theme-toggle:hover { background: var(--primary); color: white; }
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; background: linear-gradient(135deg, var(--bg) 0%, #1e1b4b 100%); }
        .light-mode .hero { background: linear-gradient(135deg, var(--bg) 0%, #e0e7ff 100%); }
        .hero-content h1 { font-size: 3.5rem; margin-bottom: 1rem; animation: fadeInUp 1s ease; }
        .hero-content h1 span { background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-content p { font-size: 1.3rem; color: var(--text-muted); margin-bottom: 2rem; animation: fadeInUp 1s ease 0.2s both; }
        .cta-buttons { display: flex; gap: 1rem; justify-content: center; animation: fadeInUp 1s ease 0.4s both; }
        .btn { padding: 1rem 2rem; border-radius: 50px; text-decoration: none; font-weight: bold; transition: all 0.3s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4); }
        .btn-secondary { border: 2px solid var(--primary); color: var(--primary); background: transparent; }
        .btn-secondary:hover { background: var(--primary); color: white; }
        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem; padding: 3rem 5%; background: var(--bg-card); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .stat-item { text-align: center; padding: 1.5rem; }
        .stat-item h3 { font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem; }
        .stat-item p { color: var(--text-muted); }
        section { padding: 5rem 5%; }
        .section-title { text-align: center; font-size: 2.5rem; margin-bottom: 3rem; position: relative; }
        .section-title::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 60px; height: 4px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 2px; }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; max-width: 1400px; margin: 0 auto; }
        .project-card { background: var(--bg-card); border-radius: 20px; overflow: hidden; border: 1px solid var(--border); transition: all 0.3s ease; }
        .project-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); border-color: var(--primary); }
        .project-header { padding: 1.5rem; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .project-header h3 { font-size: 1.3rem; margin-bottom: 0.5rem; }
        .project-header .project-tag { display: inline-block; background: rgba(255, 255, 255, 0.2); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; }
        .project-body { padding: 1.5rem; }
        .project-body p { color: var(--text-muted); margin-bottom: 1rem; }
        .chart-container { position: relative; height: 250px; margin: 1rem 0; }
        .project-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1rem; }
        .metric { text-align: center; padding: 0.8rem; background: rgba(99, 102, 241, 0.1); border-radius: 10px; }
        .metric-value { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .metric-label { font-size: 0.8rem; color: var(--text-muted); }
        .project-links { display: flex; gap: 1rem; margin-top: 1rem; }
        .project-links a { flex: 1; text-align: center; padding: 0.8rem; border-radius: 10px; text-decoration: none; font-weight: 500; transition: all 0.3s; }
        .project-links .view-project { background: var(--primary); color: white; }
        .project-links .view-code { border: 1px solid var(--border); color: var(--text); }
        .project-links a:hover { transform: translateY(-2px); }
        .skills-container { max-width: 1200px; margin: 0 auto; }
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; }
        .skill-category { background: var(--bg-card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); }
        .skill-category h3 { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; color: var(--primary); }
        .skill-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .skill-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
        .skill-progress { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 4px; transition: width 1s ease; }
        .about-container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 3rem; align-items: center; }
        .about-image { text-align: center; }
        .about-image img { width: 250px; height: 250px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary); }
        .about-content h3 { font-size: 1.8rem; margin-bottom: 1rem; }
        .about-content p { color: var(--text-muted); margin-bottom: 1rem; }
        .experience-list { list-style: none; margin-top: 1.5rem; }
        .experience-list li { display: flex; align-items: center; gap: 1rem; padding: 1rem; background: var(--bg-card); border-radius: 10px; margin-bottom: 1rem; border-left: 4px solid var(--primary); }
        .experience-list i { color: var(--primary); font-size: 1.2rem; }
        .contact-container { max-width: 800px; margin: 0 auto; text-align: center; }
        .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem; margin-top: 3rem; }
        .contact-item { background: var(--bg-card); padding: 2rem; border-radius: 20px; border: 1px solid var(--border); transition: all 0.3s; }
        .contact-item:hover { transform: translateY(-5px); border-color: var(--primary); }
        .contact-item i { font-size: 2.5rem; color: var(--primary); margin-bottom: 1rem; }
        .contact-item h3 { margin-bottom: 0.5rem; }
        .contact-item a { color: var(--text-muted); text-decoration: none; transition: color 0.3s; }
        .contact-item a:hover { color: var(--primary); }
        footer { text-align: center; padding: 2rem; background: var(--bg-card); border-top: 1px solid var(--border); color: var(--text-muted); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { opacity: 0; transform: translateY(30px); transition: all 0.6s ease; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
        @media (max-width: 768px) { .hero-content h1 { font-size: 2.5rem; } .nav-links { display: none; } .about-container { grid-template-columns: 1fr; text-align: center; } .projects-grid { grid-template-columns: 1fr; } .cta-buttons { flex-direction: column; } }
    </style>
</head>
